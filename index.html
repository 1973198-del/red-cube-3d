<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Red Cube Runner</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-shell">
      <div class="hud">
        <div class="tag">Subway Surfers Style</div>
        <h1>Red Cube</h1>
        <div class="subtitle">Escape the rails</div>
      </div>

      <div class="game-wrap">
        <div id="game" class="game" aria-label="Red cube runner game">
          <div class="sky-glow"></div>
          <div class="track">
            <div class="lane lane-1"></div>
            <div class="lane lane-2"></div>
            <div class="lane lane-3"></div>
          </div>

          <div id="coins" class="coins"></div>
          <div id="obstacles" class="obstacles"></div>

          <div id="player" class="player" aria-label="Red cube player">
            <div class="cube">
              <div class="face front"></div>
              <div class="face back"></div>
              <div class="face left"></div>
              <div class="face right"></div>
              <div class="face top"></div>
              <div class="face bottom"></div>
            </div>
          </div>

          <div class="game-ui">
            <div class="score">Score: <span id="score">0</span></div>
            <div class="best">Best: <span id="best">0</span></div>
          </div>

          <div id="message" class="message hidden">Game Over</div>
        </div>
      </div>

      <div class="credit">Made by Ahmed</div>
    </div>

    <script>
      const game = document.getElementById('game');
      const playerEl = document.getElementById('player');
      const obstaclesEl = document.getElementById('obstacles');
      const coinsEl = document.getElementById('coins');
      const scoreEl = document.getElementById('score');
      const bestEl = document.getElementById('best');
      const messageEl = document.getElementById('message');

      const lanePositions = [-120, 0, 120];
      const state = {
        lane: 1,
        score: 0,
        best: Number(localStorage.getItem('redCubeBest') || 0),
        speed: 4.5,
        lastTime: 0,
        obstacles: [],
        coins: [],
        gameOver: false,
      };

      bestEl.textContent = state.best;
      renderPlayer();

      window.addEventListener('keydown', (event) => {
        const key = event.key.toLowerCase();
        if (state.gameOver) return;

        if (key === 'a') {
          state.lane = Math.max(0, state.lane - 1);
        }

        if (key === 'd') {
          state.lane = Math.min(2, state.lane + 1);
        }

        renderPlayer();
      });

      function renderPlayer() {
        playerEl.style.transform = `translateX(${lanePositions[state.lane]}px)`;
      }

      function spawnObstacle() {
        const lane = Math.floor(Math.random() * 3);
        const obstacle = document.createElement('div');
        obstacle.className = 'obstacle';
        obstacle.style.left = `${lanePositions[lane]}px`;
        obstacle.style.top = '-90px';
        obstaclesEl.appendChild(obstacle);

        state.obstacles.push({ lane, y: -90, el: obstacle, size: 72 });
      }

      function spawnCoin() {
        const lane = Math.floor(Math.random() * 3);
        const coin = document.createElement('div');
        coin.className = 'coin';
        coin.style.left = `${lanePositions[lane]}px`;
        coin.style.top = '-28px';
        coinsEl.appendChild(coin);

        state.coins.push({ lane, y: -28, el: coin, size: 24 });
      }

      function updateObstacles() {
        for (let i = state.obstacles.length - 1; i >= 0; i--) {
          const item = state.obstacles[i];
          item.y += state.speed;
          item.el.style.top = `${item.y}px`;

          if (item.y > 760) {
            item.el.remove();
            state.obstacles.splice(i, 1);
            continue;
          }

          const collision =
            item.lane === state.lane &&
            item.y + item.size > 620 &&
            item.y < 700;

          if (collision) {
            endGame();
            return;
          }
        }
      }

      function updateCoins() {
        for (let i = state.coins.length - 1; i >= 0; i--) {
          const item = state.coins[i];
          item.y += state.speed;
          item.el.style.top = `${item.y}px`;

          if (item.y > 760) {
            item.el.remove();
            state.coins.splice(i, 1);
            continue;
          }

          const collected =
            item.lane === state.lane &&
            item.y + item.size > 620 &&
            item.y < 700;

          if (collected) {
            item.el.remove();
            state.coins.splice(i, 1);
            state.score += 10;
            scoreEl.textContent = Math.floor(state.score);
            if (state.score > state.best) {
              state.best = state.score;
              bestEl.textContent = Math.floor(state.best);
              localStorage.setItem('redCubeBest', String(Math.floor(state.best)));
            }
          }
        }
      }

      function endGame() {
        state.gameOver = true;
        messageEl.classList.remove('hidden');
        messageEl.textContent = 'Game Over';
        messageEl.classList.add('game-over');
      }

      function tick(timestamp) {
        if (!state.gameOver) {
          const delta = timestamp - state.lastTime || 16;
          state.lastTime = timestamp;

          state.speed += 0.0008 * delta;
          state.score += 0.5;
          scoreEl.textContent = Math.floor(state.score);

          if (Math.random() < 0.026) spawnObstacle();
          if (Math.random() < 0.018) spawnCoin();

          updateObstacles();
          updateCoins();
        }

        requestAnimationFrame(tick);
      }

      requestAnimationFrame(tick);
    </script>
  </body>
</html>
